/**/mask_to_3d:
  ros__parameters:
    base_frame_name: "base_footprint"
    mask_topic_name: "/masks_array"
    cloud_topic_name: "/point_cloud"
    info_topic_name: "/camera_info"
    
    # Options
    # positioning_detection_mode: "point_cloud" # Options: "point_cloud", "fast_point", "depth_image"
    # enable_id: false

    # Clipping box parameters
    x_min: -0.5
    x_max: 0.5
    y_min: -0.5
    y_max: 0.5
    z_min: 0.01
    z_max: 1.5
  
    # Point Cloud Processing
    cluster_tolerance: 0.04
    min_cluster_size: 50
    max_cluster_size: 20000
    noise_point_cloud_range: 0.01
    voxel_leaf_size: 0.01
